name: Foundation validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: accounts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: WP/WC integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, curl, xml, intl, zip
          coverage: none
      - name: Install fixture database tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mariadb-server mariadb-client unzip
      - name: Validate PHP and shell syntax
        run: |
          git ls-files -z '*.php' | xargs -0 -n 1 php -l
          bash -n scripts/test-integration.sh
          node --check assets/accounts.js
          node --check assets/admin.js
      - name: Run isolated WordPress and WooCommerce tests
        run: scripts/test-integration.sh
      - name: Verify native core minimum and unsupported older core
        if: matrix.php == '8.1'
        run: |
          COMPATIBILITY_ONLY=1 WP_VERSION=6.3 scripts/test-integration.sh
          COMPATIBILITY_ONLY=1 WP_VERSION=6.2.2 scripts/test-integration.sh
      # The tested merge tree is recorded by Actions; verify that identity
      # before installing the artifact. This is not a release or deployment.
      - name: Prepare exact staging package
        if: matrix.php == '8.5' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git rev-parse HEAD HEAD^{tree}
          python3 scripts/build-release.py --candidate --output "$RUNNER_TEMP/ach-wp-accounts-candidate"
          sha256sum "$RUNNER_TEMP/ach-wp-accounts-candidate/ach-wp-accounts.zip"
      - name: Upload staging ZIP as-is
        if: matrix.php == '8.5' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/ach-wp-accounts-candidate/ach-wp-accounts.zip
          archive: false
          retention-days: 3
          if-no-files-found: error
